name: Engineering bug, code change or infrastructure incident
description: Reproducible software defects, implementation changes, CI/infrastructure and technical incidents only.
title: "[Engineering] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are only for actionable code, engineering, infrastructure or technical
        incidents with clear acceptance criteria. Do not file research coordination,
        scientific audits or expert review requests here. Those belong in the
        research work page; announcements and conversations belong in community docs.
        Never include identifying patient data, credentials, or restricted records.
  - type: input
    id: component
    attributes:
      label: Affected component
      description: File, package, endpoint, workflow, or deployed service.
      placeholder: scripts/validate.py or .github/workflows/validate.yml
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Reproducible problem or change requested
      description: Describe actual vs expected behavior, and the technical impact.
      placeholder: What breaks? What specifically needs implementing?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps or technical evidence
      description: Exact steps, failing tests, relevant source links, error output, or logs. For proposals, include measurable evidence or a concrete design gap.
      placeholder: Commands, URLs, observed error and relevant revision.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Engineering acceptance criteria
      description: How can a maintainer verify completion?
      placeholder: Tests, code changes, deployment checks, or demonstrated recovery.
    validations:
      required: true
