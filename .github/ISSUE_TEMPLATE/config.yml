# GitHub Issues are exclusively for engineering defects and code changes.
# Community participation lives in docs until the repository enables Discussions.
blank_issues_enabled: false
contact_links:
  - name: General discussion, introductions, collaboration, or announcements
    url: https://github.com/dovvnloading/open-cancer/blob/main/docs/community/README.md
    about: These are not issue tickets. Use the community guide; GitHub Discussions may be enabled later.
  - name: Become an independent scientific reviewer
    url: https://github.com/dovvnloading/open-cancer/blob/main/docs/community/independent-reviewers.md
    about: Reviewer recruitment, scientific audit coordination and independent research review are never Issues.
  - name: Research tasks, scientific review and independent validation
    url: https://github.com/dovvnloading/open-cancer/blob/main/docs/research/egfr-luad-open-work.md
    about: Research coordination, scientific audits and expert assessments are handled in research documentation and review PRs, not Issues.
  - name: Operational status and scheduled monitoring reports
    url: https://github.com/dovvnloading/open-cancer/actions
    about: Read GitHub Actions summaries/artifacts. Open an issue only for a specific, reproducible technical failure.
