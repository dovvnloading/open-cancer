name: Reproducible research task or scientific QA
description: A bounded research question, data-quality audit, or scientific verification deliverable with evidence and a completion test.
title: "[Research] "
body:
  - type: markdown
    attributes:
      value: |
        Issues may track reproducible research/QA, but not generic invitations for
        reviewers or open-ended scientific chat. Independent expert credentials,
        source licenses, and clinical validation cannot be verified by automation.
        Do not upload identifying, controlled, or patient-level records.
  - type: input
    id: source
    attributes:
      label: Dataset, task, and authoritative sources
      description: Exact task, accession, public dataset or source citation to inspect.
      placeholder: tasks/egfr-luad-evidence-coverage.json, DOID:3910, official URLs
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Falsifiable research question or verification gap
      description: Include observation units, relevant filtering, limitations and known uncertainties.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Reproducible method and existing evidence
      description: Provide inputs, code/query/version or source-linked proposed method; say if not yet assessed.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Objective deliverable and acceptance criteria
      description: Report, reproducible test or data validation, expected provenance, and evidence of completion. Disputed/negative findings are welcome.
    validations:
      required: true
