name: EGFR-LUAD reproducible pilot (nonclinical)

on:
  pull_request:
    paths:
      - 'scripts/egfr_luad_pilot.py'
      - 'results/egfr-luad-evidence-coverage/**'
      - 'tests/test_egfr_luad_pilot.py'
      - '.github/workflows/research-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline scientific-data transformation tests
        run: python -m unittest discover -s tests -v
      - name: Inspect GDC public aggregate EGFR project counts
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://api.gdc.cancer.gov/analysis/top_cases_counts_by_genes?gene_ids=ENSG00000146648'
          req = urllib.request.Request(url, headers={'User-Agent':'open-cancer-pilot/0.2','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=40) as resp:
              raw=resp.read(2000000)
          data=json.loads(raw)
          print('GDC_AGG_TOP_KEYS',list(data.keys()),'RESPONSE_BYTES',len(raw),flush=True)
          buckets=data.get('aggregations',{}).get('projects',{}).get('buckets',[])
          selected=[b for b in buckets if b.get('key') == 'TCGA-LUAD']
          print('GDC_AGG_LUAD', json.dumps(selected)[:2000], flush=True)
          for gene in ('ENSG00000141510','ENSG00000155657','ENSG00000000000'):
              control_url='https://api.gdc.cancer.gov/analysis/top_cases_counts_by_genes?gene_ids='+gene
              with urllib.request.urlopen(urllib.request.Request(control_url,headers={'User-Agent':'open-cancer-pilot/0.2','Accept':'application/json'}),timeout=40) as response:
                  other=json.loads(response.read(2000000))
              bs=other.get('aggregations',{}).get('projects',{}).get('buckets',[])
              luad=next((b for b in bs if b.get('key')=='TCGA-LUAD'),{})
              print('GDC_CONTROL',gene,'luad_count',luad.get('doc_count'),'gene_buckets',luad.get('genes',{}).get('my_genes',{}).get('gene_id',{}).get('buckets'),flush=True)
          PY
      - name: Retrieve source releases and derive public summary
        run: |
          python results/egfr-luad-evidence-coverage/pilot-20261110/analyze.py \
            --out-dir results/egfr-luad-evidence-coverage/pilot-20261110 \
            --run-id pilot-20261110 \
            --emit-review-payload
      - name: Check result manifest, source references, and artifact hashes
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: egfr-luad-pilot-unreviewed
          path: |
            results/egfr-luad-evidence-coverage/pilot-20261110/manifest.json
            results/egfr-luad-evidence-coverage/pilot-20261110/coverage.json
            results/egfr-luad-evidence-coverage/pilot-20261110/civic_evidence_ids.csv
            results/egfr-luad-evidence-coverage/pilot-20261110/cbio_protein_changes.csv
          retention-days: 30
