name: EGFR-LUAD reproducible pilot (nonclinical)

on:
  pull_request:
    paths:
      - 'scripts/egfr_luad_pilot.py'
      - 'results/egfr-luad-evidence-coverage/**'
      - 'reviews/egfr-luad-evidence-coverage/**'
      - 'tests/test_egfr_luad_pilot.py'
      - '.github/workflows/research-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-pilot:
    runs-on: ubuntu-latest
    env:
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_DIR: results/egfr-luad-evidence-coverage/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline scientific-data transformation tests
        run: python -m unittest discover -s tests -v
      - name: Retrieve source releases and derive public summary
        run: |
          mkdir "$RUN_DIR"
          cp results/egfr-luad-evidence-coverage/pilot-20261110/analyze.py "$RUN_DIR/"
          python "$RUN_DIR/analyze.py" --out-dir "$RUN_DIR" --run-id "$RUN_ID" --emit-review-payload
      - name: Check result manifest, source references, and artifact hashes
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: egfr-luad-pilot-unreviewed
          path: ${{ env.RUN_DIR }}/
          retention-days: 30
