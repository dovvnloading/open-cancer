name: Monitor public Explorer release freshness

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
  # Check only after the source build/deployment workflow finishes.
  # A concurrent push-triggered check races Pages propagation and
  # temporarily reopens incidents during otherwise successful releases.
  workflow_run:
    workflows: ["Build and optionally deploy Open Cancer Explorer"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: open-cancer-public-explorer-health
  cancel-in-progress: false

jobs:
  compare-public-to-desired-release:
    # Never run a privileged workflow_run check for untrusted PR workflow
    # results; skip superseded runs when main has already advanced.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUBLIC_INDEX_URL: ${{ vars.OPEN_CANCER_EXPLORER_PUBLIC_INDEX_URL || 'https://dovvnloading.github.io/open-cancer/api/v1/index.json' }}
      EXPECTED_REVISION: ${{ vars.OPEN_CANCER_EXPLORER_DESIRED_SHA || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test production alert formatting and transition logic offline
        run: node --test tests/explorer_health_ledger.test.cjs
      - name: Check public API against desired production revision
        id: check
        shell: bash
        run: |
          set +e
          python scripts/check_explorer_freshness.py \
            --url "$PUBLIC_INDEX_URL" \
            --expected-revision "$EXPECTED_REVISION" \
            --minimum-datasets 69 \
            --wait-seconds 90 2>&1 | tee explorer-health.txt
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish public-site check as Actions summary and structured artifact
        if: always()
        uses: actions/github-script@v7
        env:
          PUBLIC_INDEX_URL: ${{ vars.OPEN_CANCER_EXPLORER_PUBLIC_INDEX_URL || 'https://dovvnloading.github.io/open-cancer/api/v1/index.json' }}
          EXPECTED_REVISION: ${{ vars.OPEN_CANCER_EXPLORER_DESIRED_SHA || github.sha }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const passed = process.env.CHECK_EXIT_CODE === '0';
            const result = {
              checked_at: new Date().toISOString(),
              public_index_url: process.env.PUBLIC_INDEX_URL,
              expected_revision: process.env.EXPECTED_REVISION,
              passed,
              output: fs.existsSync('explorer-health.txt') ?
                fs.readFileSync('explorer-health.txt', 'utf8') :
                'Check did not complete; inspect this Actions run',
            };
            fs.writeFileSync('explorer-health.json', JSON.stringify(result, null, 2) + '\\n');
            await core.summary.addRaw([
              '# Public Explorer release health',
              '',
              '**Status:** ' + (passed ? 'Current at expected revision' : 'STALE / UNREACHABLE / NOT VERIFIED'),
              '**Checked:** ' + result.checked_at,
              '**Expected revision:** ' + result.expected_revision,
              '**Public index:** ' + result.public_index_url,
              '',
              'Routine check results are stored in Actions, not GitHub Issues.',
              'For a persistent reproducible failure, file a targeted engineering issue.',
              '',
              '~~~text',
              result.output.slice(0, 4000).replaceAll('~~~', ''),
              '~~~',
            ].join('\\n')).write();
      - name: Save public-site revision check outside of Issues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-health-report
          path: |
            explorer-health.json
            explorer-health.txt
          retention-days: 90
          if-no-files-found: error
      - name: Mark stale or unavailable deployment as failure
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::Public Explorer is stale or unavailable. Inspect the Actions summary and artifact."
          exit 1
