name: Monitor public Explorer release freshness

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-public-to-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare public index with the latest main revision
        run: |
          python scripts/check_explorer_freshness.py \
            --url "https://open-cancer-explorer.lagging.chatgpt.site/api/v1/index.json" \
            --expected-revision "$GITHUB_SHA" \
            --minimum-datasets 69
