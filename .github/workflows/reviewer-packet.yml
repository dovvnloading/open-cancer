name: Build independent EGFR/LUAD reviewer packet

on:
  pull_request:
    paths:
      - "review_packets/**"
      - "scripts/build_review_packet.py"
      - "tests/test_review_packet.py"
      - ".github/workflows/reviewer-packet.yml"
  push:
    branches: [main]
    paths:
      - "review_packets/**"
      - "scripts/build_review_packet.py"
      - "tests/test_review_packet.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check structural validity and offline unit tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Assemble version-bound public reviewer materials
        run: |
          python scripts/build_review_packet.py \
            --output "$RUNNER_TEMP/open-cancer-review" \
            --archive "$RUNNER_TEMP/open-cancer-review.zip"
          cd "$RUNNER_TEMP/open-cancer-review"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: egfr-luad-independent-review-kit
          path: |
            ${{ runner.temp }}/open-cancer-review/**
            ${{ runner.temp }}/open-cancer-review.zip
          retention-days: 90
          if-no-files-found: error
