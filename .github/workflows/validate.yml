name: Validate catalog and research submissions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schemas, references, and checksums
        run: python scripts/validate.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test Explorer search, navigation and review states
        run: node --test tests/explorer.test.mjs
      - name: Test durable catalog issue ledger size and decoding
        run: node --test tests/catalog_ledger.test.cjs
      - name: Test public Explorer health alert formatting
        run: node --test tests/explorer_health_ledger.test.cjs
      - name: Test weekly operations report evidence classification
        run: node --test tests/operations_report.test.cjs
      - name: Test publication registry GitHub review authorization
        run: node --test tests/publication_pr_gate.test.cjs
      - name: Smoke test AI compute fan-out (synthetic, no external AI or source API)
        run: |
          python scripts/compute_fanout.py plan --spec workloads/egfr-luad-compute.json --output "$RUNNER_TEMP/ai-jobs.jsonl" --max-jobs 100
          python scripts/compute_fanout.py run --jobs "$RUNNER_TEMP/ai-jobs.jsonl" --output "$RUNNER_TEMP/ai-demo" \
            --investigator "python scripts/demo_compute_worker.py" \
            --critic "python scripts/demo_compute_worker.py" --workers 4 --max-jobs 100
          python -c "import json, os; from pathlib import Path; s=json.loads((Path(os.environ['RUNNER_TEMP'])/'ai-demo/summary.json').read_text()); assert s['completed'] == 9 and s['failed'] == 0 and s['triage'] == {'synthetic': 9}"
      - name: Build the Explorer and its JSON API
        run: python scripts/build_explorer.py --output _site
      - name: Save the Explorer for this revision
        uses: actions/upload-artifact@v4
        with:
          name: open-cancer-explorer-${{ github.sha }}
          path: _site/
          if-no-files-found: error


  publication-review:
    # PR-only defense in depth. Source the evaluator from the trusted base SHA,
    # not from files submitted in the PR being checked.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require independent current-head approval for editorial registry changes
        uses: actions/github-script@v7
        with:
          script: |
            const {touchesRegistry, evaluateEditorialReview} =
              require(process.env.GITHUB_WORKSPACE + '/scripts/publication_pr_gate.cjs');
            const {owner, repo} = context.repo;
            const request = context.payload.pull_request;
            if (!request) {
              core.setFailed('Publication review check requires a real pull request event');
              return;
            }
            const number = request.number;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number: number, per_page: 100});
            if (!touchesRegistry(files)) {
              core.info('Publication registry unchanged: separate editorial approval not required');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              {owner, repo, pull_number: number, per_page: 100});
            const verdict = evaluateEditorialReview({
              files,
              reviews,
              author: request.user.login,
              headSha: request.head.sha,
            });
            if (!verdict.ok) {
              core.setFailed(verdict.reason + ' (not scientific or clinical validation).');
              return;
            }
            core.info('Editorial registry approved on exact head by ' +
              verdict.reviewer + '; independently verify data rights and science.');
