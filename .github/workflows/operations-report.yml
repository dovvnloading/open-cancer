name: Publish weekly Open Cancer operations report

on:
  schedule:
    # After Monday's upstream catalog and public-release monitors.
    - cron: "17 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/operations-report.yml"
      - "scripts/operations_report.cjs"
      - "tests/operations_report.test.cjs"
      - "docs/reports/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: open-cancer-weekly-operations-report
  cancel-in-progress: false

jobs:
  reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test conservative report classification offline
        run: node --test tests/operations_report.test.cjs
      - name: Find latest retained monitoring artifacts
        id: monitor
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            for (const item of [
              {key: 'catalog', workflow: 'catalog-monitor.yml', artifact: 'catalog-health-report'},
              {key: 'public', workflow: 'explorer-freshness.yml', artifact: 'explorer-health-report'},
            ]) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: item.workflow, branch: 'main', per_page: 50,
              });
              for (const run of runs.data.workflow_runs || []) {
                if (run.status !== 'completed') continue;
                const available = await github.rest.actions.listWorkflowRunArtifacts({
                  owner, repo, run_id: run.id, per_page: 100,
                });
                if ((available.data.artifacts || []).some(artifact =>
                    artifact.name === item.artifact && !artifact.expired)) {
                  core.setOutput(item.key + '_run_id', String(run.id));
                  break;
                }
              }
            }
      - name: Download catalog metadata health report
        if: steps.monitor.outputs.catalog_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: catalog-health-report
          run-id: ${{ steps.monitor.outputs.catalog_run_id }}
          github-token: ${{ github.token }}
          path: .monitor/catalog
      - name: Download Explorer deployment freshness report
        if: steps.monitor.outputs.public_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: explorer-health-report
          run-id: ${{ steps.monitor.outputs.public_run_id }}
          github-token: ${{ github.token }}
          path: .monitor/public
      - name: Gather evidence and publish the Actions report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {examine, render} =
              require(process.env.GITHUB_WORKSPACE + '/scripts/operations_report.cjs');
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const revision = branch.data.commit.sha;
            const workflows = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 100, branch: 'main',
            });
            const runs = workflows.data.workflow_runs || [];
            const build = runs.find(run =>
              run.name === 'Build and optionally deploy Open Cancer Explorer' &&
              run.head_sha === revision && run.event === 'push');
            let deploymentJobs = [];
            if (build) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: build.id, per_page: 100,
              });
              deploymentJobs = jobs.data.jobs || [];
            }
            const releaseResponse = await github.rest.repos.listReleases({
              owner, repo, per_page: 20,
            });
            const issues = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'all', per_page: 100});
            const issueRows = issues.filter(issue => !issue.pull_request);
            const byTitle = title => issueRows.find(issue => issue.title === title);
            const readMonitorReport = path => {
              if (!fs.existsSync(path)) return null;
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (error) {
                core.warning('Could not decode monitoring artifact ' + path + ': ' + error.message);
                return null;
              }
            };
            const catalogHealth = readMonitorReport('.monitor/catalog/catalog-health-report.json');
            const publicHealth = readMonitorReport('.monitor/public/explorer-health.json');
            const data = {
              generated_at: new Date().toISOString(),
              revision,
              branch_protected: branch.data.protected === true,
              workflow_runs: runs,
              deploy_jobs: deploymentJobs,
              releases: releaseResponse.data,
              issue_states: issueRows.map(issue =>
                ({number: issue.number, title: issue.title, state: issue.state})),
              catalog_ledger: catalogHealth,
              public_ledger: publicHealth,
            };
            const summary = examine(data);
            const report = render(summary);
            fs.writeFileSync('operations-report.md', report);
            fs.writeFileSync('operations-report.json',
              JSON.stringify(summary, null, 2) + '\n');
            await core.summary.addRaw(report).write();
            core.info('Published operational report to Actions run summary and artifact; no Issue created.');
      - name: Retain markdown and machine-readable operational snapshot
        uses: actions/upload-artifact@v4
        with:
          name: open-cancer-operations-report
          path: |
            operations-report.md
            operations-report.json
          retention-days: 90
          if-no-files-found: error
