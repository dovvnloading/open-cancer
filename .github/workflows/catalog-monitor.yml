name: Monitor catalog freshness and upstream source health

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monitor_catalog.py"
      - "scripts/evaluate_catalog_health.py"
      - "tests/catalog_ledger.test.cjs"
      - "tests/test_catalog_health_eval.py"
      - "tests/test_catalog_monitor.py"
      - "scripts/refresh_catalog.py"
      - "catalog/sources/**"
      - ".github/workflows/catalog-monitor.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: open-cancer-catalog-health
  cancel-in-progress: false

jobs:
  catalog-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test metadata scan and status evaluation offline
        run: |
          python -m unittest discover -s tests -p test_catalog_monitor.py -v
          python -m unittest discover -s tests -p test_catalog_health_eval.py -v
      - name: Find last available catalog monitoring artifact (not an Issue)
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'catalog-monitor.yml', branch: 'main', per_page: 50,
            });
            for (const run of data.workflow_runs || []) {
              if (run.id === context.runId || run.status !== 'completed') continue;
              const found = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              if ((found.data.artifacts || []).some(x =>
                  x.name === 'catalog-health-report' && !x.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info('Using public metadata from Actions run ' + run.id);
                return;
              }
            }
            core.warning('No retained previous report: historical metadata drift is not assessed');
      - name: Download previous public-metadata observation baseline
        if: steps.prior.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: catalog-health-report
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-catalog-health
      - name: Scan public metadata and evaluate actionable changes
        shell: bash
        run: |
          extra=()
          if [ -f previous-catalog-health/catalog-health-report.json ]; then
            extra+=(--previous-report previous-catalog-health/catalog-health-report.json)
          fi
          python scripts/monitor_catalog.py --output catalog-health-report.json "${extra[@]}"
          python scripts/evaluate_catalog_health.py \
            --report catalog-health-report.json --summary catalog-health-summary.md "${extra[@]}"
          cat catalog-health-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save public-source observations and human-readable report in Actions
        uses: actions/upload-artifact@v4
        with:
          name: catalog-health-report
          path: |
            catalog-health-report.json
            catalog-health-summary.md
          retention-days: 90
          if-no-files-found: error
      - name: Fail on actionable upstream metadata drift or endpoint outages
        run: python scripts/evaluate_catalog_health.py --report catalog-health-report.json --check
